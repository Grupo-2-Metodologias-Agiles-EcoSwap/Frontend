<div class="min-h-screen flex">
  <!-- Left Side: Form -->
  <div class="flex-1 flex flex-col justify-center items-center px-4 sm:px-6 lg:px-8 bg-white">
    <div class="w-full max-w-md">
      <!-- Logo -->
      <div class="flex justify-center mb-6">
        <div class="flex flex-col items-center">
          <img class="h-36 w-auto drop-shadow-md" src="assets/logo.png?v=3" alt="EcoSwap Logo" />
          <span class="text-4xl font-semibold mt-3 bg-gradient-to-r from-green-400 to-cyan-500 bg-clip-text text-transparent tracking-tight">EcoSwap</span>
        </div>
      </div>

      <h2 class="text-center text-3xl font-extrabold text-gray-900 mb-6">
        Iniciar Sesión
      </h2>

      <div *ngIf="error" class="bg-red-50 text-red-500 p-3 rounded mb-4 text-center">
        {{ error }}
      </div>

      <!-- Microsoft Login (Disabled due to UPC tenant admin approval policy)
      <button type="button" (click)="loginWithMicrosoft()" [disabled]="isMicrosoftLoading" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-bold py-3 px-4 rounded-xl shadow-sm transition-all disabled:opacity-50 mb-6 group">
        <svg *ngIf="!isMicrosoftLoading" class="group-hover:scale-110 transition-transform" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 21 21">
          <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
          <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
          <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
          <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
        </svg>
        <span *ngIf="isMicrosoftLoading" class="animate-spin h-5 w-5 border-2 border-gray-400 border-t-transparent rounded-full"></span>
        {{ isMicrosoftLoading ? 'Conectando...' : 'Continuar con Microsoft (UPC)' }}
      </button>

      <div class="relative flex items-center justify-center mb-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-200"></div>
        </div>
        <div class="relative bg-white px-4 text-sm font-medium text-gray-400">O ingresa con tu correo</div>
      </div>
      -->

      <form class="space-y-5" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div>
          <input type="email" formControlName="email" required class="appearance-none rounded-xl relative block w-full px-4 py-2.5 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-green-500 focus:border-green-500 focus:z-10 sm:text-sm" placeholder="Correo Universitario">
        </div>
        <div>
          <input type="password" formControlName="password" required class="appearance-none rounded-xl relative block w-full px-4 py-2.5 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-green-500 focus:border-green-500 focus:z-10 sm:text-sm" placeholder="Contraseña">
        </div>

        <div>
          <button type="submit" [disabled]="!loginForm.valid || isLoading" class="group relative w-full flex justify-center items-center gap-2 py-2.5 px-4 border border-transparent text-sm font-medium rounded-xl text-white bg-gradient-to-r from-green-400 to-blue-500 hover:from-green-500 hover:to-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 disabled:opacity-50">
            <span *ngIf="isLoading" class="animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"></span>
            {{ isLoading ? 'Iniciando Sesión...' : 'Iniciar Sesión' }}
          </button>
        </div>
        
        <div class="text-right">
          <a href="#" class="font-medium text-sm text-gray-600 hover:text-gray-900 border-b border-gray-600">
            Olvidé mi contraseña
          </a>
        </div>
      </form>

      <div class="mt-8 text-center">
        <p class="text-sm text-gray-600">
          ¿No tienes cuenta?
          <a routerLink="/register" class="font-medium text-green-500 hover:text-green-600">
            Crear cuenta
          </a>
        </p>
      </div>
    </div>
  </div>

  <!-- Right Side: Graphic -->
  <div class="hidden lg:flex lg:flex-1 bg-gradient-to-br from-green-400 to-blue-500 relative overflow-hidden rounded-l-[3rem]">
    <div class="absolute inset-0 flex flex-col justify-start items-end p-16 z-10">
      <h2 class="text-4xl font-bold text-white text-right max-w-lg leading-tight">
        Compra y vende materiales académicos con más seguridad y menor costo
      </h2>
    </div>
    <!-- Placeholder Image -->
    <div class="absolute bottom-0 right-0 w-full h-2/3 flex justify-end items-end">
      <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&q=80&w=800" alt="Students" class="object-cover object-top w-4/5 h-full rounded-tl-3xl opacity-90 mix-blend-luminosity hover:mix-blend-normal transition-all" />
    </div>
  </div>
</div>
