<div class="min-h-screen flex">
  <!-- Left Side: Form -->
  <div class="flex-1 flex flex-col justify-center items-center px-4 sm:px-6 lg:px-8 bg-white py-6">
    <div class="w-full max-w-md">
      <!-- Logo -->
      <div class="flex justify-center mb-4">
        <div class="flex flex-col items-center">
          <img class="h-36 w-auto drop-shadow-md" src="assets/logo.png?v=3" alt="EcoSwap Logo" />
          <span class="text-4xl font-semibold mt-2 bg-gradient-to-r from-green-400 to-cyan-500 bg-clip-text text-transparent tracking-tight">EcoSwap</span>
        </div>
      </div>

      <h2 class="text-center text-3xl font-extrabold text-gray-900 mb-4">
        Crear Cuenta
      </h2>

      <div *ngIf="error" class="bg-red-50 text-red-500 p-3 rounded mb-4 text-center">
        {{ error }}
      </div>

      <!-- Microsoft Login (Disabled due to UPC tenant admin approval policy)
      <button type="button" (click)="registerWithMicrosoft()" [disabled]="isMicrosoftLoading" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-bold py-3 px-4 rounded-xl shadow-sm transition-all disabled:opacity-50 mb-6 group">
        <svg *ngIf="!isMicrosoftLoading" class="group-hover:scale-110 transition-transform" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 21 21">
          <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
          <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
          <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
          <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
        </svg>
        <span *ngIf="isMicrosoftLoading" class="animate-spin h-5 w-5 border-2 border-gray-400 border-t-transparent rounded-full"></span>
        {{ isMicrosoftLoading ? 'Conectando...' : 'Registrarse con Microsoft (UPC)' }}
      </button>

      <div class="relative flex items-center justify-center mb-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-200"></div>
        </div>
        <div class="relative bg-white px-4 text-sm font-medium text-gray-400">O crea tu cuenta manual</div>
      </div>
      -->

      <form class="space-y-3" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        
        <!-- Avatar Upload -->
        <div class="flex justify-center mb-4">
          <div class="relative group">
            <div class="w-20 h-20 rounded-full border-4 border-white bg-green-50 shadow-md flex items-center justify-center overflow-hidden transition-transform hover:scale-105 cursor-pointer" (click)="fileInput.click()">
              <img *ngIf="avatarBase64 && !isCompressing" [src]="avatarBase64" class="w-full h-full object-cover">
              <span *ngIf="!avatarBase64 && !isCompressing" class="material-icons text-3xl text-green-300">add_a_photo</span>
              <div *ngIf="isCompressing" class="absolute inset-0 bg-black/50 flex flex-col items-center justify-center text-white">
                <span class="material-icons animate-spin">sync</span>
              </div>
            </div>
            
            <!-- Remove photo button -->
            <button type="button" *ngIf="avatarBase64 && !isCompressing" 
                    (click)="removePhoto($event, fileInput)" 
                    class="absolute top-0 right-0 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center hover:bg-red-600 shadow-sm z-10 transition-colors cursor-pointer border-2 border-white">
              <span class="material-icons text-[14px] font-bold">close</span>
            </button>
            
            <div class="text-center mt-2 text-xs font-medium text-gray-500">Foto (opcional)</div>
            <input #fileInput type="file" accept="image/*" class="hidden" (change)="onFileSelected($event)" [disabled]="isCompressing">
          </div>
        </div>

        <div>
          <input type="text" formControlName="name" required class="appearance-none rounded-xl relative block w-full px-4 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm" placeholder="Nombre completo">
        </div>
        <!-- Phone input disabled as it is not stored in the database yet
        <div>
          <input type="tel" formControlName="phone" required class="appearance-none rounded-xl relative block w-full px-4 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm" placeholder="Teléfono">
        </div>
        -->
        <div>
          <input type="email" formControlName="email" required class="appearance-none rounded-xl relative block w-full px-4 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm" placeholder="Correo Universitario">
        </div>
        <div>
          <input type="password" formControlName="password" required class="appearance-none rounded-xl relative block w-full px-4 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm" placeholder="Contraseña">
        </div>
        <div>
          <input type="password" formControlName="confirmPassword" required class="appearance-none rounded-xl relative block w-full px-4 py-2 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm" placeholder="Confirmar contraseña">
          <p *ngIf="registerForm.hasError('mismatch') && registerForm.get('confirmPassword')?.touched" class="text-red-500 text-xs mt-1">Las contraseñas no coinciden.</p>
        </div>

        <div class="pt-1">
          <button type="submit" [disabled]="!registerForm.valid || isLoading" class="group relative w-full flex justify-center items-center gap-2 py-2.5 px-4 border border-transparent text-sm font-medium rounded-xl text-white bg-gradient-to-r from-green-400 to-blue-500 hover:from-green-500 hover:to-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 disabled:opacity-50">
            <span *ngIf="isLoading" class="animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"></span>
            {{ isLoading ? 'Creando Cuenta...' : 'Crear Cuenta' }}
          </button>
        </div>
      </form>

      <div class="mt-4 text-center">
        <p class="text-sm text-gray-600">
          ¿Tienes una cuenta?
          <a routerLink="/login" class="font-medium text-green-500 hover:text-green-600">
            Iniciar sesión
          </a>
        </p>
      </div>
    </div>
  </div>

  <!-- Right Side: Graphic -->
  <div class="hidden lg:flex lg:flex-1 bg-gradient-to-br from-green-400 to-blue-500 relative overflow-hidden rounded-l-[3rem]">
    <div class="absolute inset-0 flex flex-col justify-start items-end p-16 z-10">
      <h2 class="text-4xl font-bold text-white text-right max-w-lg leading-tight">
        Compra y vende materiales académicos con más seguridad y menor costo
      </h2>
    </div>
    <!-- Placeholder Image -->
    <div class="absolute bottom-0 right-0 w-full h-2/3 flex justify-end items-end">
      <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&q=80&w=800" alt="Students" class="object-cover object-top w-4/5 h-full rounded-tl-3xl opacity-90 mix-blend-luminosity hover:mix-blend-normal transition-all" />
    </div>
  </div>
</div>
